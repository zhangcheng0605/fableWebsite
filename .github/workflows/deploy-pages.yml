name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          # Keep the deploy lean: the film frame sequences (assets/film/*/,
          # ~84 MB) are kept in the repo for an easy revert of the old dark
          # design but no page loads them — only the three still-*.jpg files
          # in assets/film/ are referenced. The unminified three.js sources
          # are the provenance of the .min.js builds every page actually uses.
          # heartbeat.py runs in the Action, never in a browser; cinema.js is the player
          # for the frame sequences above, which no page loads.
          # One line, no spaces after the commas: peaceiris splits this string on
          # "," and does not trim, so a folded block scalar (>-) silently turns
          # every entry after the first into " assets/…", which matches nothing.
          exclude_assets: '.github,assets/film/city,assets/film/city-sm,assets/film/gate,assets/film/gate-sm,assets/film/vanguard,assets/film/vanguard-sm,assets/fonts/build-subset.py,campus/vendor/three/three.module.js,campus/vendor/three/three.core.js,campus/vendor/three/OrbitControls.js,campus/vendor/three/OBJExporter.js,campus/vendor/three/GLTFExporter.js,trading/heartbeat.py,trading/__pycache__,assets/cinema.js'

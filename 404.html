<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page not found</title>
  <meta name="theme-color" content="#fdf4ff">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* design tokens — candy-neon, matching the landing page */
      --background:#fdf4ff; --foreground:#38235c;
      --pink:#ff3fae; --purple:#8b3dff; --cyan:#25c4ff;
      --ring:#8b3dff;
      --cta:linear-gradient(95deg,#ef1f96,#7a2df0 46%,#0f9fe0);
      --radius:18px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body::before { content:""; position:fixed; inset:0; z-index:-1;
      background:
        radial-gradient(62vw 52vh at 12% 6%, rgba(255,183,226,.55), transparent 65%),
        radial-gradient(56vw 46vh at 88% 16%, rgba(178,140,255,.45), transparent 65%),
        radial-gradient(72vw 60vh at 50% 108%, rgba(126,216,255,.5), transparent 70%),
        linear-gradient(180deg,#fff4fd,#f4e9ff 45%,#eaf6ff); }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--foreground);
      font-family: Quicksand, Inter, system-ui, sans-serif;
      font-weight: 500;
      text-align: center;
      padding: 24px;
    }
    ::selection { background: rgba(255,63,174,.25); }
    :focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; border-radius: 6px; }
    h1,h2,h3,h4 { text-wrap: balance; font-family: "Baloo 2", Quicksand, sans-serif; }
    h1 {
      font-size: clamp(5rem, 20vw, 10rem);
      line-height: 1;
      background: var(--cta);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 6px 30px rgba(255,63,174,.3));
    }
    p { margin: 16px 0 32px; font-size: 1.1rem; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      cursor: pointer;
      color: #fff;
      text-decoration: none;
      font-family: "Baloo 2", Quicksand, sans-serif;
      font-weight: 800;
      padding: 13px 28px;
      border-radius: 999px;
      background: var(--cta);
      box-shadow: 0 12px 38px rgba(255,63,174,.3);
      transition: transform 0.2s ease;
    }
    a:hover { transform: translateY(-2px); }
    a:active { transform: translateY(0) scale(.98); }
    a:focus-visible { outline-offset: 4px; border-radius: 999px; }
    @media (prefers-reduced-motion: reduce) {
      a { transition: none; }
      a:hover, a:active { transform: none; }
    }
  </style>
  <link rel="stylesheet" href="/fableWebsite/assets/bunny.css">
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page drifted off into the sparkles. &#10024;</p>
    <a href="https://zhangcheng0605.github.io/fableWebsite/">Take me home</a>
  </main>
  <script src="/fableWebsite/assets/bunny.js" defer></script>
</body>
</html>

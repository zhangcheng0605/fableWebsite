<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FoW Wireframe</title>
<link rel="canonical" href="https://zhangcheng0605.github.io/fableWebsite/fow/wireframe/">
<meta name="description" content="meIQ, the December policy assistant: five screens, desktop and phone, with PRD notes, decisions and open questions.">
<style>
html,body{margin:0}
/* Wireframe language from fow/wireframe (Zac): black lines on white, #111 ink,
   4–6px radius, no shadows, pill buttons, dashed drop zones. Single theme by choice. */
:root{
  --ink:#111; --ink-2:#444; --ink-3:#8c8c8c; --line:#cfcfcf; --hair:#e6e6e6; --paper:#fff;
  --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--ui);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 56px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
a{color:var(--ink)}

/* ================= demo controls ================= */
.top{max-width:1320px;margin:0 auto;padding-block:22px 16px;display:flex;flex-direction:column;gap:14px;border-bottom:1.5px solid var(--ink)}
.top-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.top h1{margin:0;font-size:22px;letter-spacing:-.02em;text-wrap:balance}
.top h1 span{color:var(--ink-3);font-weight:500}
.top .sub{color:var(--ink-3);font-size:13px}
.legend{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:12px;border:1.5px solid var(--ink);border-radius:3px;display:inline-block}
.sw.res{border-style:dashed;border-color:var(--ink-3)}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:1.5px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:650;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.tab b{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-3)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tab[aria-selected="true"] b{color:#bdbdbd}
.right-ctrls{margin-left:auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{padding:5px 13px;font-size:12.5px;font-weight:650}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tog{font-size:12.5px;display:inline-flex;gap:8px;align-items:center;color:var(--ink-2);white-space:nowrap}
.prof{font-size:12.5px;display:inline-flex;gap:8px;align-items:center;color:var(--ink-2);white-space:nowrap}
.sel{position:relative;display:inline-flex}
.sel::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none;color:var(--ink)}
.sel select{appearance:none;-webkit-appearance:none;font:inherit;font-size:12.5px;font-weight:650;color:var(--ink);background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:5px 30px 5px 13px;cursor:pointer;max-width:100%}
.sel select:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.tog .knob{width:30px;height:16px;border:1.5px solid var(--ink);border-radius:999px;position:relative;flex:none}
.tog .knob::after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:50%;background:var(--ink);transition:left .15s}
.tog[aria-pressed="true"] .knob{background:var(--ink)}
.tog[aria-pressed="true"] .knob::after{left:15px;background:#fff}

/* ================= shared atoms ================= */
.mark{width:24px;height:24px;border:1.5px solid var(--ink);border-radius:4px;display:grid;place-items:center;font-size:12px;font-weight:800;background:#fff;flex:none;letter-spacing:-.02em}
.face{width:26px;height:26px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.fine{font-size:11px;color:var(--ink-3)}
.btn{align-self:flex-start;font-size:12.5px;font-weight:650;border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;background:var(--ink);color:#fff;white-space:nowrap}
.btn:hover{background:#fff;color:var(--ink)}
.btn[disabled]{background:#fff;color:var(--ink-3);border-color:var(--hair);cursor:default}
.obtn{height:28px;border:1px solid var(--line);border-radius:4px;padding:0 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.obtn:hover{border-color:var(--ink)}
.obtn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.msg{display:flex;flex-direction:column;gap:6px;max-width:100%}
.msg.user{align-items:flex-end}
.bubble{border:1px solid var(--ink);border-radius:4px;padding:9px 12px;font-size:13.5px;max-width:92%}
.bubble.none{border-style:dashed}
.bubble p{margin:0}
.bubble p+p{margin-top:6px}
.msg.user .bubble{background:var(--ink);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);border-radius:3px;padding:2px 8px;font-size:11.5px;background:#fff;color:var(--ink)}
.who-line{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3)}
.who-line .mark{width:20px;height:20px;font-size:9.5px}
.src{position:relative;border:1px solid var(--ink);border-left-width:3px;border-radius:4px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:12.5px;max-width:92%;text-align:left}
.src .ico{grid-row:span 3;width:22px;height:28px;border:1.5px solid var(--ink);border-radius:2px;position:relative;margin-top:2px}
.src .ico::before,.src .ico::after{content:"";position:absolute;left:4px;right:4px;height:1.5px;background:var(--ink)}
.src .ico::before{top:8px}.src .ico::after{top:14px}
.src .ico.vid::before{top:8px;left:7px;right:auto;width:0;height:0;background:none;border-left:8px solid var(--ink);border-top:5px solid transparent;border-bottom:5px solid transparent}
.src .ico.vid::after{display:none}
.src b{font-size:13px}
.src .meta{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.src .go{font-size:12px;font-weight:650;text-decoration:underline;justify-self:start}
.applies{font-size:12px;color:var(--ink-2)}
.applies span{color:var(--ink-3)}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sugs{display:flex;flex-direction:column;gap:8px}
.sug{text-align:left;border:1px solid var(--ink);border-radius:4px;padding:8px 11px;font-size:13px}
.sug:hover{background:var(--ink);color:#fff}
.drop{display:grid;place-items:center;align-content:center;gap:6px;text-align:center;min-height:180px;border:1.5px dashed var(--ink);border-radius:6px;padding:18px;position:relative}
.drop b{font-size:17px;letter-spacing:-.01em}
.drop span{font-size:12.5px;color:var(--ink-3)}
.search{border:1px solid var(--ink);border-radius:4px;padding:8px 10px;font:inherit;font-size:13px;width:100%;background:#fff;color:var(--ink)}
.grp{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:10px}
.hist{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-bottom:1px solid var(--hair);padding:10px 2px;text-align:left;width:100%}
.hist span{font-size:13.5px}
.hist em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);flex:none}
.hist:hover span{text-decoration:underline}

/* annotation pins */
.pin{display:none;flex:none;min-width:19px;height:19px;padding:0 4px;border-radius:999px;background:var(--ink);color:#fff;font:700 10.5px/19px var(--mono);text-align:center;font-style:normal;vertical-align:middle}
body.notes .pin{display:inline-block}
.pin.abs{position:absolute;top:-9px;right:-9px;z-index:3}
body.notes .pin.abs{display:block}

/* ================= desktop frame ================= */
.stage{max-width:1320px;margin:18px auto 0;display:flex;flex-direction:column;gap:18px}
.frame{border:1.5px solid var(--ink);border-radius:6px;display:flex;min-height:660px;overflow:hidden}
.left{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:8px;font-weight:750;letter-spacing:-.01em;font-size:15px}
.url{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);border:1px solid var(--hair);border-radius:3px;padding:2px 8px}
.bar .who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.canvas{display:flex;flex-direction:column;gap:36px;padding:48px clamp(18px,4vw,56px) 48px;max-width:980px;width:100%;margin:0 auto}
.hero h2{margin:0;font-size:clamp(30px,3.6vw,46px);line-height:1.05;letter-spacing:-.035em;text-wrap:balance}
.hero p{margin:10px 0 0;font-size:17px;color:var(--ink-3);letter-spacing:-.01em}
.hint{display:inline-flex;align-items:center;gap:10px;margin-top:20px;font-size:13px;border:1.5px dashed var(--ink);border-radius:999px;padding:7px 15px}
.hint i{font-style:normal;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(6px)}}
.row{display:flex;flex-direction:column;gap:12px}
.verb{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.verb b{font-size:21px;letter-spacing:-.02em}
.verb span{font-size:13px;color:var(--ink-3)}
.verb .tag{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:4px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;padding:16px 18px 18px;min-height:168px;cursor:grab;transition:transform .18s cubic-bezier(.2,.8,.3,1.2);text-align:left}
.tile:hover{transform:translateY(-3px)}
.tile.dragging{opacity:.35}
.big{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.line{font-size:13px;color:var(--ink-2)}
.doc{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:5px}
.doc i{display:block;height:5px;border-radius:2px;background:var(--hair)}
.doc i.chg{background:var(--ink)}
.doc-cap{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:4px}
.later{border:1.5px dashed var(--ink-3);border-radius:6px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;position:relative}
.later-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.later-h b{font-size:15px}
.later-h span{font-size:12.5px;color:var(--ink-3)}
.tile.res{border:1.5px dashed var(--ink-3);cursor:default;color:var(--ink-3);min-height:140px}
.tile.res:hover{transform:none}
.tile.res .big{color:var(--ink-3);font-size:22px}
.tile.res .line{color:var(--ink-3)}
.tile.res .btn{margin-top:auto}
.tile.res.lit{border-color:var(--ink);color:var(--ink);outline:3px solid var(--ink);outline-offset:3px}
.tile.res.lit .big,.tile.res.lit .line{color:var(--ink)}
.job{display:flex;align-items:center;gap:14px;padding:10px 4px;border-top:1px solid var(--hair);color:var(--ink-3)}
.job .mark{border-color:var(--ink-3);color:var(--ink-3)}
.job b{font-weight:600;font-size:14px}
.job .btn{margin-left:auto}

.dock{width:404px;flex:none;display:flex;flex-direction:column;border-left:1.5px solid var(--ink);position:relative;background:#fff}
.dock.over{outline:3px solid var(--ink);outline-offset:-3px}
.d-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--hair);min-height:57px}
.d-name{font-weight:720;font-size:14.5px}
.d-name small{color:var(--ink-3);font-weight:500}
.d-sub{font-size:11px;color:var(--ink-3)}
.d-tools{margin-left:auto;display:flex;gap:6px}
.d-body{flex:1;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px;min-height:420px}
.d-foot{border-top:1px solid var(--hair);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.composer{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--ink);border-radius:4px;padding:8px;background:#fff}
.composer textarea,.composer input{flex:1;min-width:0;border:0;resize:none;font:inherit;font-size:13.5px;outline:none;background:transparent;color:var(--ink)}
.composer textarea{min-height:38px}
.send{background:var(--ink);color:#fff;border-radius:4px;padding:7px 12px;font-size:12.5px;font-weight:650}
.drawer{position:absolute;inset:57px 0 0 0;background:#fff;border-top:1px solid var(--ink);display:flex;flex-direction:column;z-index:5}
.drawer .d-body{gap:4px}

/* ================= phone ================= */
.stage.mobile{max-width:1100px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:32px;align-items:start}
.phone{width:min(390px,100%);border:1.5px solid var(--ink);border-radius:40px;padding:9px;background:#fff}
.screen{position:relative;border:1px solid var(--line);border-radius:31px;height:780px;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.status{display:flex;align-items:center;justify-content:space-between;padding:12px 26px 6px;font:600 12px var(--mono)}
.status .island{width:96px;height:24px;border:1.5px solid var(--ink);border-radius:999px}
.status .sig{display:flex;gap:2px;align-items:flex-end}
.status .sig i{width:3px;background:var(--ink);border-radius:1px}
.appbar{display:flex;align-items:center;gap:8px;padding:6px 16px 10px;border-bottom:1px solid var(--hair)}
.appbar .brand{font-size:16px}
.appbar .ic{margin-left:auto;display:flex;gap:6px;align-items:center}
.icb{width:32px;height:32px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;font-size:15px;line-height:1;position:relative}
.icb[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.m-body{flex:1;overflow:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px}
.m-hello h2{margin:0;font-size:28px;letter-spacing:-.03em;line-height:1.05}
.m-hello p{margin:6px 0 0;color:var(--ink-3);font-size:15px}
.m-sec{display:flex;flex-direction:column;gap:2px;position:relative}
.m-sec .label{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.m-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 10px;padding:11px 2px;border-top:1px solid var(--hair);text-align:left;width:100%}
.m-row:last-child{border-bottom:1px solid var(--hair)}
.m-row b{font-size:15px;letter-spacing:-.01em}
.m-row small{grid-column:1;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.m-row .chev{grid-row:1/3;grid-column:2;font-size:18px;color:var(--ink-3)}
.m-later{display:flex;gap:6px;flex-wrap:wrap}
.m-later span{border:1.5px dashed var(--ink-3);color:var(--ink-3);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600}
.m-sugs{display:flex;flex-wrap:wrap;gap:8px}
.m-sugs .sug{border-radius:999px;padding:7px 12px;font-size:12.5px}
.m-body .bubble{max-width:88%;font-size:14px}
.m-body .src{max-width:100%;padding:9px 11px}
.m-body .src .ico{grid-row:span 2}
.m-acts{display:flex;gap:16px;font-size:12.5px;position:relative}
.m-acts button{text-decoration:underline;text-underline-offset:3px;color:var(--ink-2)}
.m-stack{display:flex;flex-direction:column;gap:8px}
.m-stack .btn{align-self:stretch;text-align:center;padding:10px 14px;font-size:13.5px}
.m-stack .btn.alt{background:#fff;color:var(--ink)}
.m-foot{border-top:1px solid var(--hair);padding:10px 12px 8px;position:relative}
.m-foot .composer{align-items:center;padding:6px 6px 6px 12px}
.m-foot .composer input{font-size:15px;height:32px}
.m-foot .send{width:34px;height:34px;padding:0;font-size:16px;display:grid;place-items:center}
.homebar{width:120px;height:4px;background:var(--ink);border-radius:2px;margin:10px auto 8px}
.sheet{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;z-index:4}
.sheet-h{display:flex;align-items:center;gap:10px;padding:52px 16px 12px;border-bottom:1px solid var(--hair)}
.sheet-h b{font-size:17px}
.sheet-h .icb{margin-left:auto}
.sheet .m-body{gap:4px}

/* ================= notes ================= */
.notes-wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.stage.mobile .notes-wrap{grid-template-columns:1fr}
body:not(.notes) .notes-wrap{display:none}
.np{border:1.5px solid var(--ink);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.np.q{border-style:dashed}
.np h3{margin:0;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase}
.np h3 small{letter-spacing:0;text-transform:none;font-weight:500;color:var(--ink-3);font-size:12px;margin-left:6px}
.np ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.np li{display:grid;grid-template-columns:26px 1fr;gap:4px;font-size:13.5px;max-width:72ch}
.np .pin{display:inline-block;justify-self:start}
.np .dot{font-family:var(--mono);color:var(--ink-3);text-align:center;width:19px}
.np .ok{font-family:var(--mono);font-weight:700;width:19px;text-align:center}
.np .own{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.np + .np{margin-top:0}
.side{display:flex;flex-direction:column;gap:18px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;border:1px solid var(--ink);border-left-width:3px;border-radius:4px;padding:9px 14px;font-size:12.5px;z-index:10;max-width:calc(100vw - 32px)}

@media (max-width:1060px){
  .frame{flex-direction:column}
  .dock{width:auto;border-left:0;border-top:1.5px solid var(--ink)}
  .notes-wrap{grid-template-columns:1fr}
  .legend,.right-ctrls{margin-left:0}
}
@media (max-width:860px){
  .stage.mobile{grid-template-columns:minmax(0,1fr);justify-items:center}
  .stage.mobile .side{width:100%}
}
@media (max-width:760px){
  .grid{grid-template-columns:1fr}
  .tile{min-height:0}
  .canvas{padding-top:28px;gap:28px}
  .bar .who span,.url{display:none}
}
@media (max-width:440px){
  .phone{border:0;padding:0;border-radius:0}
  .screen{border-radius:18px;border-color:var(--ink);height:720px}
  .status{display:none}
  .sheet-h{padding-top:14px}
}
@media (prefers-reduced-motion:reduce){.hint i{animation:none}.tile{transition:none}}
</style>

</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>meIQ <span>· December policy assistant</span></h1>
    <span class="sub">Five screens for the web PRD, desktop and phone, in the FoW wireframe style. Content is sample.</span>
    <div class="legend">
      <span><i class="sw"></i>Goes live 31 Dec</span>
      <span><i class="sw res"></i>Later phases, hidden at launch</span>
    </div>
  </div>
  <div class="ctrls">
    <div class="tabs" role="tablist" aria-label="Screens">
      <button class="tab" role="tab" id="t-home" data-tab="home"><b>1</b>Home</button>
      <button class="tab" role="tab" id="t-answer" data-tab="answer"><b>2</b>Answer with source</button>
      <button class="tab" role="tab" id="t-cantfind" data-tab="cantfind"><b>3</b>Can't find it</button>
      <button class="tab" role="tab" id="t-outofscope" data-tab="outofscope"><b>4</b>Not yet possible</button>
      <button class="tab" role="tab" id="t-history" data-tab="history"><b>5</b>History</button>
    </div>
    <div class="right-ctrls">
      <label class="prof">View as <span class="sel"><select id="profileSel" aria-label="View as profile"></select></span></label>
      <div class="seg" role="group" aria-label="Device">
        <button id="v-desktop" data-view="desktop" aria-pressed="true">Desktop</button>
        <button id="v-mobile" data-view="mobile" aria-pressed="false">Phone</button>
      </div>
      <button class="tog" id="slotsBtn" aria-pressed="false"><span class="knob"></span>Show later phases</button>

function answerParts(){

  "Later-phase slots: hidden until they work. Keep it minimal.",
  "Name: meIQ.",
  "Phones: the same things, shown more minimally.",
];
const OPEN = [
  ["Domain name for the standalone site. It is now on the critical path.", "CIS · A96"],
  ["Standalone should still be internal-only behind SSO. That sets the CIS scope and how deep the pen test goes.", "Tech + CIS"],
  ["Which SSO field holds the BU, and is it right for all 14 BUs?", "Tech"],
  ["1-year history: confirm with the data protection officer and CIS. Who, if anyone, can read chats for audit?", "CIS + DPO"],
  ["meIQ: check the name is free internally and agree it with Comms.", "Product"],
  ["Phones: a responsive page on the same address, not an app.", "Product"],
];
function notes(){
  const [t, items] = NOTES[S.screen];
  const idx = ["home","answer","cantfind","outofscope","history"].indexOf(S.screen) + 1;
  const list = S.view === "mobile" ? MNOTES[S.screen] : items;
  const li = ([k, v]) => `<li>${k === "·" ? `<span class="dot">·</span>` : `<i class="pin">${k}</i>`}<span>${v}</span></li>`;
  return `<div class="notes-wrap">
    <div class="np"><h3>Screen ${idx} · ${t}<small>${S.view === "mobile" ? "phone" : "desktop"}</small></h3><ol>${list.map(li).join("")}</ol>
      ${S.view === "mobile" ? `<p class="fine">Rules are the same as desktop. Switch to Desktop for the full notes on this screen.</p>` : ""}</div>
    <div class="side">
      <div class="np"><h3>Decided<small>Zac, 27 Sep</small></h3><ol>${DECIDED.map(d => `<li><span class="ok">✓</span><span>${d}</span></li>`).join("")}</ol></div>
      <div class="np q"><h3>Still open<small>who answers</small></h3><ol>${OPEN.map(([q, o]) => `<li><span class="dot">?</span><span>${q} <span class="own">${o}</span></span></li>`).join("")}</ol></div>
    </div>
  </div>`;
}

/* ---------------- render + events ---------------- */
function render(){
  const st = $("#stage");
  st.className = "stage" + (S.view === "mobile" ? " mobile" : "");
  st.innerHTML = S.view === "mobile"
    ? `${phone()}<div class="side">${notes()}</div>`
    : `${desktop()}${notes()}`;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === S.screen));
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === S.view));
  $("#profileSel").value = S.profile;
  $("#slotsBtn").setAttribute("aria-pressed", S.slots);
  $("#notesBtn").setAttribute("aria-pressed", S.notes);
  document.body.classList.toggle("notes", S.notes);
}
function go(screen, policy, chip){
  S.screen = screen; S.policy = policy || null; S.chip = !!chip; render();
  try { history.replaceState(null, "", "#" + screen + (S.profile === "digital" ? "" : "/" + S.profile)); } catch (e) {}
}
$("#profileSel").innerHTML = PROFILES.map(p => `<option value="${p.id}">${esc(p.name)} · ${esc(p.bu)}</option>`).join("");
$("#profileSel").addEventListener("change", e => { S.profile = e.target.value; go(S.screen); });

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-view],[data-go],[data-policy],[data-toast],[data-hist],#slotsBtn,#notesBtn");
  if (!t) return;
  if (t.dataset.tab) return go(t.dataset.tab);
  if (t.dataset.view) { S.view = t.dataset.view; return render(); }
  if (t.id === "slotsBtn") { S.slots = !S.slots; return render(); }
  if (t.id === "notesBtn") { S.notes = !S.notes; return render(); }
  if (t.hasAttribute("data-hist")) return go(S.screen === "history" ? "home" : "history");
  if (t.dataset.go) return go(t.dataset.go, t.dataset.p);
  if (t.dataset.policy) return go("answer", t.dataset.policy, true);
  if (t.dataset.toast) toast(t.dataset.toast);
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches(".tile[data-policy]")) go("answer", e.target.dataset.policy, true);
});
document.addEventListener("submit", e => {
  if (!e.target.matches("[data-composer]")) return;
  e.preventDefault(); toast("Wireframe only. Use the screen tabs to see each state.");
});
document.addEventListener("input", e => {
  if (e.target.id !== "hsearch") return;
  const q = e.target.value.toLowerCase();
  e.target.parentElement.querySelectorAll(".hist").forEach(h => h.hidden = !h.textContent.toLowerCase().includes(q));
});
/* drag a tile into the chat (desktop) */
document.addEventListener("dragstart", e => {
  const t = e.target.closest && e.target.closest(".tile[data-policy]");
  if (!t) return; t.classList.add("dragging"); e.dataTransfer.setData("text/plain", t.dataset.policy);
});
document.addEventListener("dragend", e => { const t = e.target.closest && e.target.closest(".tile"); if (t) t.classList.remove("dragging"); });
document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest(".dock"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest(".dock"); if (d && !d.contains(e.relatedTarget)) d.classList.remove("over"); });
document.addEventListener("drop", e => {
  const d = e.target.closest && e.target.closest(".dock"); if (!d) return;
  e.preventDefault(); const id = e.dataTransfer.getData("text/plain"); if (pol(id)) go("answer", id, true);
});

let tt;
function toast(m){
  let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = m; clearTimeout(tt); tt = setTimeout(() => t.remove(), 2600);
}

const [start, startProf] = (location.hash || "").slice(1).split("/");
if (NOTES[start]) S.screen = start;
if (PROFILES.some(p => p.id === startProf)) S.profile = startProf;
if (window.matchMedia && matchMedia("(max-width: 700px)").matches) S.view = "mobile";
render();
</script>
</body>
</html>

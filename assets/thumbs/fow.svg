<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="FoW, Future of Work: a workspace with a seat picker of seven roles beside approvals pre-read by an AI copilot">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4fd"/>
      <stop offset="0.5" stop-color="#f4e9ff"/>
      <stop offset="1" stop-color="#eaf6ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3fae" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#8b3dff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#25c4ff" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef1f96"/>
      <stop offset="0.5" stop-color="#7a2df0"/>
      <stop offset="1" stop-color="#0f9fe0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <ellipse cx="180" cy="40" rx="440" ry="250" fill="url(#glow)"/>
  <ellipse cx="1120" cy="690" rx="440" ry="250" fill="url(#glow)"/>

  <g stroke="#6d28d9" stroke-opacity="0.07">
    <path d="M0 120H1280M0 240H1280M0 360H1280M0 480H1280M0 600H1280"/>
    <path d="M160 0V720M320 0V720M480 0V720M640 0V720M800 0V720M960 0V720M1120 0V720"/>
  </g>

  <!-- the workspace window -->
  <rect x="72" y="64" width="1136" height="592" rx="30" fill="#ffffff" stroke="#8b3dff" stroke-opacity="0.22" stroke-width="3"/>
  <!-- title bar -->
  <path d="M72 94a30 30 0 0 1 30-30h1076a30 30 0 0 1 30 30v40H72z" fill="#f4ecff"/>
  <circle cx="112" cy="99" r="8" fill="#ff3fae"/><circle cx="140" cy="99" r="8" fill="#ffb830"/><circle cx="168" cy="99" r="8" fill="#12b981"/>
  <text x="640" y="107" text-anchor="middle" fill="#6428d8"
        font-family="'JetBrains Mono',ui-monospace,monospace" font-size="20" letter-spacing="7">FoW · FUTURE OF WORK · DEMO</text>

  <!-- seat picker -->
  <text x="112" y="182" fill="#c9106f" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="16" letter-spacing="5">CHOOSE YOUR SEAT</text>
  <g font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="700">
    <rect x="112" y="202" width="300" height="50" rx="14" fill="url(#cta)"/>
    <text x="134" y="235" fill="#ffffff">Procurement Lead</text>
    <g fill="#f3e9ff" stroke="#8b3dff" stroke-opacity="0.25" stroke-width="2">
      <rect x="112" y="266" width="300" height="50" rx="14"/>
      <rect x="112" y="330" width="300" height="50" rx="14"/>
      <rect x="112" y="394" width="300" height="50" rx="14"/>
      <rect x="112" y="458" width="300" height="50" rx="14"/>
      <rect x="112" y="522" width="300" height="50" rx="14"/>
    </g>
    <g fill="#38235c">
      <text x="134" y="299">HR Business Partner</text>
      <text x="134" y="363">FP&amp;A Manager</text>
      <text x="134" y="427">IT Operations</text>
      <text x="134" y="491">Senior Legal Counsel</text>
      <text x="134" y="555">Creative &amp; Marketing</text>
    </g>
  </g>
  <text x="112" y="612" fill="#6428d8" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="15" letter-spacing="3">+ ENTERPRISE SALES · 7 SEATS</text>

  <!-- the copilot pane -->
  <line x1="452" y1="150" x2="452" y2="620" stroke="#8b3dff" stroke-opacity="0.18" stroke-width="2"/>
  <text x="492" y="182" fill="#c9106f" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="16" letter-spacing="5">TODAY · PRE-READ BY THE COPILOT</text>

  <g font-family="Inter,system-ui,sans-serif">
    <rect x="492" y="202" width="676" height="86" rx="18" fill="#f7f2ff" stroke="#8b3dff" stroke-opacity="0.22" stroke-width="2"/>
    <text x="516" y="238" fill="#38235c" font-size="24" font-weight="700">18 purchase orders waiting · $486,300</text>
    <text x="516" y="270" fill="#6428d8" font-size="19">Each one summarised, risk-scored and ready for your call.</text>

    <rect x="492" y="306" width="676" height="86" rx="18" fill="#f7f2ff" stroke="#8b3dff" stroke-opacity="0.22" stroke-width="2"/>
    <text x="516" y="342" fill="#38235c" font-size="24" font-weight="700">Aisha's flights · $3,214</text>
    <text x="516" y="374" fill="#6428d8" font-size="19">Low risk — cleared on Autopilot.</text>
    <g transform="translate(1012 322) rotate(-8)">
      <rect x="0" y="0" width="140" height="42" rx="8" fill="none" stroke="#12b981" stroke-width="4"/>
      <text x="70" y="30" text-anchor="middle" fill="#12b981" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="21" font-weight="700" letter-spacing="3">APPROVED</text>
    </g>

    <rect x="492" y="410" width="676" height="86" rx="18" fill="#f7f2ff" stroke="#8b3dff" stroke-opacity="0.22" stroke-width="2"/>
    <text x="516" y="446" fill="#38235c" font-size="24" font-weight="700">Adobe renewal · $86,400</text>
    <text x="516" y="478" fill="#6428d8" font-size="19">Above the line — waits for you.</text>
    <g transform="translate(1020 426)">
      <rect x="0" y="0" width="128" height="40" rx="20" fill="#fff3d6"/>
      <text x="64" y="27" text-anchor="middle" fill="#a35d00" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="17" letter-spacing="2">REVIEW</text>
    </g>

    <!-- chat line -->
    <rect x="492" y="530" width="676" height="72" rx="36" fill="#ffffff" stroke="#8b3dff" stroke-opacity="0.35" stroke-width="3"/>
    <circle cx="536" cy="566" r="16" fill="url(#cta)"/>
    <text x="568" y="574" fill="#9a8bb8" font-size="22">Ask the copilot about this…</text>
    <rect x="1088" y="546" width="60" height="40" rx="20" fill="url(#cta)"/>
    <text x="1118" y="574" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">→</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Tiananmen project: the Gate of Heavenly Peace — a crimson wall with five arches under two golden hip roofs, the marble bridges over the moat in front">
  <defs>

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
{ // sky: soft blue gradient + clouds
  const c=document.createElement('canvas'); c.width=1024; c.height=512; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,512);
  g.addColorStop(0,'#5f92bd'); g.addColorStop(.5,'#9dbdd6'); g.addColorStop(.82,'#d5e2ea'); g.addColorStop(1,'#e6ecf0');
  x.fillStyle=g; x.fillRect(0,0,1024,512);
  for (let i=0;i<130;i++){
    const cx=Math.random()*1024, cy=60+Math.random()*300, r=18+Math.random()*55;
    const cg=x.createRadialGradient(cx,cy,2,cx,cy,r);
    cg.addColorStop(0,'rgba(255,255,255,.5)'); cg.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=cg; x.beginPath(); x.arc(cx,cy,r,0,7); x.fill();
  }
  const sky=new THREE.CanvasTexture(c); sky.colorSpace=THREE.SRGBColorSpace; scene.background=sky;
}
scene.fog = new THREE.Fog(0xc3d2de, 180, 900);
{ const c=document.createElement('canvas'); c.width=64; c.height=64; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,64);
  g.addColorStop(0,'#ffffff'); g.addColorStop(.45,'#e2e8ee'); g.addColorStop(.5,'#9dabb7'); g.addColorStop(1,'#cbd4db');
  x.fillStyle=g; x.fillRect(0,0,64,64);
  const env=new THREE.CanvasTexture(c); env.mapping=THREE.EquirectangularReflectionMapping; scene.environment=env; }

const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 1400);
scene.add(new THREE.HemisphereLight(0xffffff, 0xc4ccd2, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(42,62,48); key.castShadow = true; key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera, { left:-42, right:42, top:52, bottom:-6, near:20, far:190 });
key.shadow.bias = -0.0004; scene.add(key);
const rim = new THREE.DirectionalLight(0xdfeaf2, 1.3); rim.position.set(-56,36,-44); scene.add(rim);
const fillL = new THREE.DirectionalLight(0xffffff, 0.85); fillL.position.set(-32,18,56); scene.add(fillL);
const under = new THREE.PointLight(0xbfe2ff, 0, 70); under.position.set(0,5,9); scene.add(under);

/* ---------- materials ---------- */
const brushed = (()=>{ const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
  x.fillStyle='#808080'; x.fillRect(0,0,256,256);
  for (let i=0;i<2600;i++){ const g=120+Math.random()*70; x.strokeStyle=`rgb(${g},${g},${g})`; x.lineWidth=Math.random()*1.2;
    const y=Math.random()*256; x.beginPath(); x.moveTo(0,y); x.lineTo(256,y+(Math.random()-.5)*3); x.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,2); return t; })();

const M = {
  armor:  new THREE.MeshStandardMaterial({ color:0x9e2320, roughness:.3, metalness:.85, roughnessMap:brushed, name:'crimsonArmor' }),
  armorD: new THREE.MeshStandardMaterial({ color:0x6a1512, roughness:.38, metalness:.8, roughnessMap:brushed, name:'crimsonDeep' }),
  gun:    new THREE.MeshStandardMaterial({ color:0x581410, roughness:.4, metalness:.85, name:'crimsonDark' }),
  chrome: new THREE.MeshStandardMaterial({ color:0xd4a94e, roughness:.2, metalness:1, name:'gold' }),
  joint:  new THREE.MeshStandardMaterial({ color:0x2b1a12, roughness:.55, metalness:.85, name:'jointDarkBronze' }),
  inner:  new THREE.MeshStandardMaterial({ color:0xc9a34f, roughness:.24, metalness:1, name:'innerGold' }),
  innerD: new THREE.MeshStandardMaterial({ color:0x54100c, roughness:.45, metalness:.9, name:'innerCrimson' }),
  piston: new THREE.MeshStandardMaterial({ color:0xe3c06a, roughness:.12, metalness:1, name:'goldRod' }),
  rivet:  new THREE.MeshStandardMaterial({ color:0xc9a34f, roughness:.25, metalness:1, name:'goldRivet' }),
  recess: new THREE.MeshStandardMaterial({ color:0x1c1210, roughness:.85, metalness:.4, name:'panelGap' })
};
M.brass = M.chrome;
const glowMats = [], innerGlowMats = [];
const mkGlow = (arr=glowMats) => { const m = new THREE.MeshStandardMaterial({ color:0x171310, emissive:0xffe9c0, emissiveIntensity:0, roughness:.25, metalness:.3, name:'glow' }); arr.push(m); return m; };

const box = (w,h,d,mat) => new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
const cyl = (rt,rb,h,mat,seg=18) => new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
const sph = (r,mat,w=16,h=12) => new THREE.Mesh(new THREE.SphereGeometry(r,w,h), mat);
const shadowify = g => { g.traverse(n=>{ if(n.isMesh){ n.castShadow=true; n.receiveShadow=true; } }); return g; };

function rivetRow(n,span,r,mat=M.rivet){
  const im = new THREE.InstancedMesh(new THREE.CylinderGeometry(r,r,r*1.2,8), mat, n);
  const m4 = new THREE.Matrix4(), rot = new THREE.Matrix4().makeRotationX(Math.PI/2);
  for (let i=0;i<n;i++){ m4.makeTranslation((i-(n-1)/2)*(span/Math.max(1,n-1)),0,0); im.setMatrixAt(i, m4.clone().multiply(rot)); }
  return im;
}
function plate(w,h,d,mat=M.armor){
  const g = new THREE.Group();
  g.add(box(w*1.02,h*1.02,d*0.86,M.recess));
  const main = box(w,h,d,mat); main.position.z = d*0.12; g.add(main);
  const bev = box(w*0.95,h*0.075,d*1.16,M.chrome); bev.position.set(0,h*0.45,d*0.1); g.add(bev);
  const ins = box(w*0.68,h*0.58,d*1.18,M.armorD); ins.position.z = d*0.1; g.add(ins);
  const rv = rivetRow(Math.max(2,Math.round(w*1.05)), w*0.74, Math.min(0.1,h*0.07));
  rv.position.set(0,-h*0.32,d*0.66); g.add(rv);
  return g;
}
function vents(n,w,h,d,gap,mat=M.joint){
  const g = new THREE.Group();
  for (let i=0;i<n;i++){ const v = box(w,h,d,mat); v.position.y=(i-(n-1)/2)*(h+gap); g.add(v); }
  return g;
}
function hydraulic(len,r=0.3){
  const g = new THREE.Group();
  const sl = cyl(r*1.55,r*1.55,len*0.55,M.joint,12); sl.position.y=-len*0.2; g.add(sl);
  g.add(cyl(r,r,len,M.piston,12));
  for (const y of [len*0.5,-len*0.5]){ const c2 = cyl(r*1.9,r*1.9,r*1.2,M.chrome,12); c2.position.y=y; g.add(c2); }
  return g;
}
function cableBundle(n,len,r=0.085){
  const g = new THREE.Group();
  for (let i=0;i<n;i++){
    const cu = new THREE.CatmullRomCurve3([ new THREE.Vector3(0,len/2,0),
      new THREE.Vector3((i-n/2)*0.24, 0, -0.55-Math.random()*0.45),
      new THREE.Vector3((i-n/2)*0.17, -len/2, 0) ]);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(cu,10,r,6,false), M.joint));
  }
  return g;
}
function nozzle(r,len,mat=M.gun){
  const g = new THREE.Group();
  g.add(cyl(r,r*1.25,len,mat,16));
  const lip = cyl(r*1.35,r*1.35,len*0.16,M.chrome,16); lip.position.y=-len*0.5; g.add(lip);
  const glow = cyl(r*0.8,r*0.8,len*0.2,mkGlow(),14); glow.position.y=-len*0.42; g.add(glow);
  return g;
}

/* ---------- registry: parts fly to POSED transforms ---------- */
const MECH = new THREE.Group(); MECH.scale.set(0.88, 1.30, 0.90); scene.add(MECH);   // tall, elongated proportions
const RAISE = [];                                   // arm-raise finale rig
const ARMR = [];                                    // right arm refs (stance adjustment waving)
const jets = [];                                    // foot thruster glows
let repMat = null, repLight = null;
const parts = [];
function reg(grp, s, e, fromPos, fromRot=[0,0,0], anchorY, noMicro=false){
  grp.userData = { win:[s,e], home:grp.position.clone(), homeRot:grp.rotation.clone(),
    from:new THREE.Vector3(...fromPos), rot:new THREE.Euler(...fromRot), prevK:0, anchorY:anchorY ?? grp.position.y };
  grp.visible = false; shadowify(grp); MECH.add(grp); parts.push(grp);
  if (!noMicro){                                     // every small component gets its own fly-in inside the group window
    const micros = [];
    grp.traverse(n => {
      if (!n.isMesh && !n.isInstancedMesh) return;
      const dir = n.position.lengthSq() > 0.01 ? n.position.clone().normalize() : new THREE.Vector3(Math.random()-0.5,Math.random()-0.5,Math.random()-0.5).normalize();
      const gs = Math.random()*0.55;
      micros.push({ n, p0:n.position.clone(), r0:n.rotation.clone(),
        from:dir.multiplyScalar(5+Math.random()*13),
        rr:new THREE.Euler((Math.random()-0.5)*2.4,(Math.random()-0.5)*2.4,(Math.random()-0.5)*2.4),
        gs, ge: gs+0.3+Math.random()*0.15 });
    });
    grp.userData.micros = micros;
  }
  return grp;
}
const easeLock = k => k<0.85 ? Math.pow(k/0.85,2)*0.96 : 0.96 + 0.04*(1-Math.pow(1-(k-0.85)/0.15,3));
function updateParts(p,t){
  for (const g of parts){
    const [s,e] = g.userData.win;
    const k = Math.min(1, Math.max(0,(p-s)/(e-s)));
    g.visible = k > 0.002;
    const tt = 1 - easeLock(k), u = g.userData;
    g.position.copy(u.home).addScaledVector(u.from, tt);
    g.rotation.set(u.homeRot.x + u.rot.x*tt, u.homeRot.y + u.rot.y*tt, u.homeRot.z + u.rot.z*tt);
    if (u.micros && k > 0 && k < 1.001){
      for (const m of u.micros){
        const kk = Math.min(1, Math.max(0,(k-m.gs)/(m.ge-m.gs)));
        m.n.visible = kk > 0.002;
        const mt = 1 - (1-Math.pow(1-kk,3));
        m.n.position.copy(m.p0).addScaledVector(m.from, mt);
        m.n.rotation.set(m.r0.x+m.rr.x*mt, m.r0.y+m.rr.y*mt, m.r0.z+m.rr.z*mt);
      }
    }
    if (u.prevK < 0.999 && k >= 0.999){ u.lockT = t; sparkBurst(u.home.x, u.anchorY, u.home.z+2); }
    if (u.lockT !== undefined && u.lockT >= 0){                    // impact punch: overshoot shudder on lock
      const dl = t - u.lockT;
      g.scale.setScalar(dl < 0.5 ? 1 + 0.14*Math.exp(-dl*9)*Math.sin(dl*34) : 1);
    }
    u.prevK = k;
  }
}

/* ================= ROOFTOP DECK + CITY + HQ TOWER ================= */
{
  const deckTex = (()=>{ const c=document.createElement('canvas'); c.width=c.height=512; const x=c.getContext('2d');
    x.fillStyle='#c9cdd1'; x.fillRect(0,0,512,512);
    for (let i=0;i<512;i+=64) for (let j=0;j<512;j+=64){ const v=((i*7+j*13)%4)*4;
      x.fillStyle=`rgb(${198+v},${202+v},${206+v})`; x.fillRect(i+2,j+2,60,60); }
    x.strokeStyle='#a9adb2'; x.lineWidth=3;
    for (let i=0;i<=512;i+=64){ x.beginPath();x.moveTo(i,0);x.lineTo(i,512);x.stroke(); x.beginPath();x.moveTo(0,i);x.lineTo(512,i);x.stroke(); }
    x.strokeStyle='#e8b93c'; x.lineWidth=8; x.strokeRect(96,96,320,320);            // safety marking square
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(7,5); t.colorSpace=THREE.SRGBColorSpace; return t; })();
  const deck = new THREE.Mesh(new THREE.BoxGeometry(300,2,210), new THREE.MeshStandardMaterial({ map:deckTex, roughness:.8, metalness:.1, name:'officeDeck' }));
  deck.position.y=-1; deck.receiveShadow=true; scene.add(deck);
  const pad = cyl(17,18,0.6,M.gun,54); pad.position.y=0.3; pad.receiveShadow=true; scene.add(pad);
  const padRing = new THREE.Mesh(new THREE.TorusGeometry(17.6,0.18,8,64), mkGlow()); padRing.rotation.x=Math.PI/2; padRing.position.y=0.62; scene.add(padRing);
  for (let a=0;a<16;a++){ const mkr = box(0.45,0.1,3,M.chrome); mkr.position.set(Math.cos(a*Math.PI/8)*21,0.06,Math.sin(a*Math.PI/8)*21); mkr.rotation.y=-a*Math.PI/8; scene.add(mkr); }
  for (const s of [-1,1]){                                                          // deck edge rails + vents
    const rail = box(298,0.9,0.4, new THREE.MeshStandardMaterial({ color:0x8f9aa4, roughness:.4, metalness:.9, name:'rail' }));
    rail.position.set(0,1.4,s*104); scene.add(rail);
    const hvac = box(14,4,8, new THREE.MeshStandardMaterial({ color:0xb4bac0, roughness:.7, name:'hvac' }));
    hvac.position.set(s*95,2,-80); scene.add(hvac);
  }

  const glassTex = (()=>{ const c=document.createElement('canvas'); c.width=256; c.height=512; const x=c.getContext('2d');
    x.fillStyle='#7fa3ad'; x.fillRect(0,0,256,512);
    for (let j=6;j<512;j+=20) for (let i=6;i<256;i+=26){
      x.fillStyle = Math.random()<0.22 ? 'rgba(235,245,250,.85)' : 'rgba(30,50,62,.55)';
      x.fillRect(i,j,18,12);
    }
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; return t; })();
  const glassMat = new THREE.MeshStandardMaterial({ map:glassTex, roughness:.35, metalness:.6, name:'towerGlass' });
  const slabMat = new THREE.MeshStandardMaterial({ color:0xb9c6cc, roughness:.5, metalness:.5, name:'towerSlab' });

  const tower = new THREE.Group(); tower.position.set(-95,-1,-150); tower.rotation.y=0.35; scene.add(tower);   // HQ tower (original, no logos)
  const core = new THREE.Mesh(new THREE.BoxGeometry(30,190,22), glassMat); core.position.y=95; tower.add(core);
  glassTex.repeat.set(1.4,7);
  const slabEdge = new THREE.Mesh(new THREE.BoxGeometry(33,190,4), slabMat); slabEdge.position.set(0,95,-13); tower.add(slabEdge);
  const crown = new THREE.Mesh(new THREE.BoxGeometry(30,26,22), slabMat); crown.position.set(0,196,3); crown.rotation.x=-0.18; tower.add(crown);
  const leg = new THREE.Mesh(new THREE.TorusGeometry(62,6.5,10,40,Math.PI/2.15), slabMat);                       // sweeping curved leg
  leg.rotation.set(0,0,Math.PI*0.99); leg.position.set(48,62,0); tower.add(leg);
  const deckC = new THREE.Mesh(new THREE.BoxGeometry(85,3.2,26), slabMat); deckC.position.set(38,124,0); tower.add(deckC);   // cantilever deck
  const deckHouse = new THREE.Mesh(new THREE.BoxGeometry(48,16,20), glassMat); deckHouse.position.set(18,133,0); tower.add(deckHouse);
  const deckLip = new THREE.Mesh(new THREE.BoxGeometry(85,0.9,27), new THREE.MeshStandardMaterial({ color:0x6f7d86, roughness:.4, metalness:.8, name:'deckLip' })); deckLip.position.set(38,126,0); tower.add(deckLip);
  const mono = (()=>{ const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d');
    x.fillStyle='#123'; x.beginPath(); x.arc(64,64,60,0,7); x.fill();
    x.fillStyle='#9fe0ef'; x.font='bold 64px monospace'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('S9',64,68);
    const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; })();
  const monoDisc = new THREE.Mesh(new THREE.CircleGeometry(7,32), new THREE.MeshBasicMaterial({ map:mono }));
  monoDisc.position.set(-6,140,11.2); tower.add(monoDisc);

const MISSILES = [];
{
  const exhaustMat = new THREE.MeshStandardMaterial({ color:0x201408, emissive:0xffb060, emissiveIntensity:0, roughness:.4, name:'exhaust' });
  function mkMissile(start, vel, delay){
    const g = new THREE.Group();
    const body = cyl(0.22,0.22,1.7,M.armorD,10); body.rotation.x=Math.PI/2; g.add(body);
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.21,0.6,10), M.chrome); tip.rotation.x=Math.PI/2; tip.position.z=1.1; g.add(tip);
    const fin1 = box(0.7,0.05,0.4,M.chrome); fin1.position.z=-0.6; g.add(fin1);
    const fin2 = box(0.05,0.7,0.4,M.chrome); fin2.position.z=-0.6; g.add(fin2);
    const ex = cyl(0.15,0.05,0.9,exhaustMat,8); ex.rotation.x=Math.PI/2; ex.position.z=-1.2; g.add(ex);
    g.visible = false; MECH.add(g);
    MISSILES.push({ g, start:new THREE.Vector3(...start), vel:new THREE.Vector3(...vel), delay, prev:0, ex:exhaustMat });
  }
  for (const s of [-1,1]) for (let mx=0;mx<3;mx++) for (let mz=0;mz<2;mz++)             // back racks: 12 skyward
    mkMissile([s*3.4+(mx-1)*1.05, 27.2, -4.6+(mz-0.5)*1.05],
              [s*(1.5+Math.random()*4), 26+Math.random()*8, -5+Math.random()*5],
              Math.random()*0.4);
  for (let mi=0;mi<4;mi++)                                                              // right-hand pod: 4 forward
    mkMissile([11.6+(mi-1.5)*0.75, 12.8, 8.6],
              [(mi-1.5)*2.2, 7+Math.random()*4, 30+Math.random()*8],
              0.35+mi*0.09);
}
function updateMissiles(p,t){
  const lp = Math.min(1, Math.max(0,(p-0.962)/0.038));
  const CYCLE = 2.6;
  for (const m of MISSILES){
    if (lp <= m.delay){ m.g.visible = false; m.prev = 0; continue; }
    const ph = ((t + m.delay*CYCLE*2) % CYCLE) / CYCLE;          // endless volleys
    const mk = ph;
    m.g.visible = mk > 0.01 && mk < 0.98;
    if (m.prev > mk) sparkBurst(m.start.x, m.start.y, m.start.z, true);
    if (m.g.visible){
      const ft = mk*1.9;
      m.g.position.set(
        m.start.x + m.vel.x*ft,
        m.start.y + m.vel.y*ft - 7*ft*ft,
        m.start.z + m.vel.z*ft);
      V1.set(m.vel.x, m.vel.y - 14*ft, m.vel.z).add(m.g.position);
      m.g.lookAt(V1);
      m.ex.emissiveIntensity = 4 + Math.sin(t*37 + m.delay*80)*1.5;
    }
    m.prev = mk;
  }
}

const sparkPool = [], ringPool = [];
let shake = 0;
function ringBurst(x,y,z){
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1,0.09,8,40),
    new THREE.MeshBasicMaterial({ color:0xffd98a, transparent:true, opacity:0.9 }));
  ring.rotation.x = Math.PI/2; ring.position.set(x,y,z);
  ring.userData.life = 0; scene.add(ring); ringPool.push(ring);
}
function sparkBurst(x,y,z,small=false){
  const n = small ? 22 : 68, arr = new Float32Array(n*3);
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(arr,3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color:0xffd9a0, size:0.38, transparent:true, opacity:1 }));
  const posA = geo.attributes.position, vel = [];
  for (let i=0;i<n;i++){
    posA.setXYZ(i,x,y,z);
    const a=Math.random()*Math.PI*2, b=Math.random()*Math.PI-Math.PI/2, sp=8+Math.random()*22;
    vel.push([Math.cos(a)*Math.cos(b)*sp, Math.sin(b)*sp+6, Math.sin(a)*Math.cos(b)*sp]);
  }
  pts.userData = { vel, life:0 }; scene.add(pts); sparkPool.push(pts);
  ringBurst(x,y,z-1);
  shake = Math.min(1.2, shake + (small ? 0.16 : 0.55));
  flashEl.style.opacity = small ? Math.max(parseFloat(flashEl.style.opacity||0), 0.06) : 0.22;
}
function updateSparks(dt){
  for (let i=sparkPool.length-1;i>=0;i--){
    const s = sparkPool[i]; s.userData.life += dt;
    const posA = s.geometry.attributes.position;
    for (let j=0;j<posA.count;j++){
      const v = s.userData.vel[j]; v[1] -= 32*dt;
      posA.setXYZ(j, posA.getX(j)+v[0]*dt, Math.max(0.1,posA.getY(j)+v[1]*dt), posA.getZ(j)+v[2]*dt);
    }
    posA.needsUpdate = true;
    s.material.opacity = Math.max(0, 1 - s.userData.life*1.6);
    if (s.userData.life > 0.75){ scene.remove(s); s.geometry.dispose(); s.material.dispose(); sparkPool.splice(i,1); }
  }
  for (let i=ringPool.length-1;i>=0;i--){
    const r = ringPool[i]; r.userData.life += dt;
    const l = r.userData.life;
    r.scale.setScalar(1 + l*16);
    r.material.opacity = Math.max(0, 0.9 - l*1.8);
    if (l > 0.55){ scene.remove(r); r.geometry.dispose(); r.material.dispose(); ringPool.splice(i,1); }
  }
}

const playBtn = document.getElementById('playBtn');

function stopPlay(){ playing = false; playBtn.textContent = '▶ PLAY ASSEMBLY'; }
playBtn.addEventListener('click', () => {
  if (playing){ stopPlay(); return; }
  playing = true; playBtn.textContent = '■ STOP';
  const max = document.documentElement.scrollHeight - innerHeight;
  const from = 0, t0 = performance.now();
  scrollTo(0, 0); smooth = 0;
  (function step(ts){
    if (!playing) return;
    const k = Math.min(1, (ts - t0)/20000);
    scrollTo(0, from + (max-from)*k);
    if (k < 1) requestAnimationFrame(step); else stopPlay();
  })(t0);
});

  const pr = Math.min(1, Math.max(0,(p-0.90)/0.07));            // raise the left arm
  const hv = Math.min(1, Math.max(0,(p-0.90)/0.06));            // lift-off hover
  if (pr > 0){
    const e2 = pr*pr*(3-2*pr);
    for (const r of RAISE){
      const u = r.g.userData;
      r.g.position.set(u.home.x+(r.tp[0]-u.home.x)*e2, u.home.y+(r.tp[1]-u.home.y)*e2, u.home.z+(r.tp[2]-u.home.z)*e2);
      r.g.rotation.set(u.homeRot.x+(r.tr[0]-u.homeRot.x)*e2, u.homeRot.y+(r.tr[1]-u.homeRot.y)*e2, u.homeRot.z+(r.tr[2]-u.homeRot.z)*e2);
    }
  }
  if (hv > 0){                                                   // hover: waving right arm + stance adjustments
    const w1 = Math.sin(t*1.35), w2 = Math.sin(t*0.9+1.7), w3 = Math.sin(t*1.8+0.6);
    ARMR[0].rotation.z += hv*(-0.12+w1*0.10);
    ARMR[1].rotation.x += hv*(w1*0.22-0.15); ARMR[1].rotation.z += hv*(w2*0.12-0.1);
    ARMR[2].rotation.x += hv*(w2*0.3-0.25); ARMR[2].rotation.z += hv*w3*0.08;
    ARMR[3].rotation.x += hv*(w2*0.34-0.2);
    for (const r of RAISE) r.g.rotation.x += hv*Math.sin(t*2.2)*0.035;   // aim micro-adjust on raised arm
    torsoCore.rotation.y += hv*w2*0.05; chestArmor.rotation.y += hv*w2*0.05;
    pelvisArmor.rotation.y += hv*w1*0.03;
  }
  for (const jm of jets) jm.opacity = hv*(0.42 + 0.3*Math.sin(t*28) + Math.random()*0.12);
  const ch = Math.min(1, Math.max(0,(p-0.945)/0.05));           // repulsor super-bright charge
  if (repMat){
    const flick = 1 + Math.sin(t*17)*0.25 + Math.sin(t*41)*0.12;
    repMat.emissiveIntensity = ch*7*flick;
    repLight.intensity = ch*26*flick;

  }

  const innerOn = Math.min(1, Math.max(0,(p-0.05)/0.05));

  const ig = Math.min(1, Math.max(0,(p-0.79)/0.07));
  const pulse = 1 + Math.sin(t*3)*0.12;
  for (const m of glowMats) m.emissiveIntensity = ig*2.4*pulse;
  under.intensity = ig*2.4;
  if (p>0.79 && ig<1) flashEl.style.opacity = Math.max(parseFloat(flashEl.style.opacity||0), (0.5-Math.abs(ig-0.5))*0.55);

  const idle = Math.min(1, Math.max(0,(p-0.86)/0.08));
  MECH.position.y = Math.sin(t*1.05)*0.13*idle + hv*hv*320;     // soar ~100 m up
  MECH.rotation.y = -0.16*idle + Math.sin(t*0.38)*0.035*idle;
  if (innerSuit.userData.home) innerSuit.position.y = innerSuit.userData.home.y + Math.sin(t*1.05)*0.13*idle;

  camPos.getPoint(p,V1); camTgt.getPoint(p,V2);
  V1.sub(V2); SPH.setFromVector3(V1);
  SPH.theta += yaw;
  SPH.phi = Math.max(0.15, Math.min(Math.PI/2+0.2, SPH.phi - pitch));
  V1.setFromSpherical(SPH).add(V2);
  camera.position.copy(V1);
  if (shake > 0.003){                                        // impact camera shake
    camera.position.x += (Math.random()-0.5)*shake*0.7;
    camera.position.y += (Math.random()-0.5)*shake*0.5;
    shake *= Math.exp(-dt*5.5);
  }
  camera.lookAt(V2);

  titleEl.style.opacity = p<0.02 ? 1 : Math.max(0, 1-(p-0.02)*45);
  hintEl.style.opacity = p<0.01 ? 1 : 0;
  barEl.style.width = (p*100)+'%';
  let shown = null;
  for (const c of phases) if (p>=c.s && p<=c.e){ shown = c; break; }
  if (shown){ hudPh.textContent=shown.ph; hudSt.textContent=shown.st;
    hudPc.textContent='ASSEMBLY '+Math.round(Math.min(1,p/0.84)*100)+'%'; hudEl.style.opacity=1; }
  else hudEl.style.opacity = 0;

  renderer.render(scene, camera);
});
</script>
